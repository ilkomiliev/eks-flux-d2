apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - https://github.com/kubernetes-sigs/aws-load-balancer-controller/releases/download/v2.13.4/v2_13_4_full.yaml
  - ingressclass.yaml
patches:
  - target:
      kind: ServiceAccount
      name: aws-load-balancer-controller
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::264930181295:role/first-tofu-eks-load-balancer-controller
  - target:
      kind: Deployment
      name: aws-load-balancer-controller
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --cluster-name=first-tofu-eks
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --aws-region=us-east-1
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --aws-vpc-id=vpc-0db8776443ec72339