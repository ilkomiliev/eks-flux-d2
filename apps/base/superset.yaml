apiVersion: superset.apache.org/v1alpha1
kind: Superset
metadata:
    name: superset
spec:
    image:
        repository: 264930181295.dkr.ecr.us-east-1.amazonaws.com/first-tofu-superset
        tag: 6.1.0
        pullPolicy: Always
    environment: Development
    secretKeyFrom:
        name: superset-auth
        key: secret-key
    metastore:
        type: PostgreSQL
        host: superset-db
        database: superset
        username: superset
        passwordFrom:
            name: superset.superset-db.credentials.postgresql.acid.zalan.do
            key: password
    valkey:
        host: valkey-superset-cache
        cache:
            database: 0
            keyPrefix: superset_cache_
        dataCache:
            database: 0
            keyPrefix: superset_data_
        filterStateCache:
            database: 0
            keyPrefix: superset_filter_
        exploreFormDataCache:
            database: 0
            keyPrefix: superset_explore_
        thumbnailCache:
            database: 0
            keyPrefix: superset_thumbnail_
        distributedCoordination:
            database: 0
            keyPrefix: superset_coordination_
        celeryBroker:
            database: 0
        celeryResultBackend:
            database: 0
        resultsBackend:
            database: 0
            keyPrefix: superset_results_
    config: |
        # Keep Cachelib multi-key commands within the single Valkey hash slot.
        CACHE_CONFIG["CACHE_KEY_PREFIX"] = "{superset}_cache_"
        DATA_CACHE_CONFIG["CACHE_KEY_PREFIX"] = "{superset}_data_"
        FILTER_STATE_CACHE_CONFIG["CACHE_KEY_PREFIX"] = "{superset}_filter_"
        EXPLORE_FORM_DATA_CACHE_CONFIG["CACHE_KEY_PREFIX"] = "{superset}_explore_"
        THUMBNAIL_CACHE_CONFIG["CACHE_KEY_PREFIX"] = "{superset}_thumbnail_"
        DISTRIBUTED_COORDINATION_CONFIG["CACHE_KEY_PREFIX"] = "{superset}_coordination_"
        RESULTS_BACKEND.key_prefix = "{superset}_results_"
        CeleryConfig.broker_transport_options = {"global_keyprefix": "{superset}_celery_"}
        CeleryConfig.result_backend_transport_options = {"global_keyprefix": "{superset}_celery_results_"}
    webServer:
        replicas: 1
        service:
            type: ClusterIP
    lifecycle:
        init:
            command:
                - /bin/sh
                - -c
                - superset init && superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password "$SUPERSET_ADMIN_PASSWORD" || true
        podTemplate:
            container:
                env:
                    - name: SUPERSET_ADMIN_PASSWORD
                      valueFrom:
                        secretKeyRef:
                            name: superset-auth
                            key: admin-password
    podTemplate:
        container:
            resources:
                requests:
                    cpu: 300m
                    memory: 1Gi
                limits:
                    cpu: "1"
                    memory: 2Gi
sops:
