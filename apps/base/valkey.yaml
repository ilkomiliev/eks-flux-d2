apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: superset-cache
spec:
  shards: 1
  replicas: 0
  image: valkey/valkey:9.0.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  exporter:
    enabled: false
  persistence:
    size: 1Gi
    storageClassName: gp3
    reclaimPolicy: Delete
  workloadType: StatefulSet