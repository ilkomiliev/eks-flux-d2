apiVersion: superset.apache.org/v1alpha1
kind: Superset
metadata:
  name: superset
spec:
  networking:
    ingress:
      className: alb
      host: '*.us-east-1.elb.amazonaws.com'
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
        alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:264930181295:certificate/049237e7-982d-42a6-a73c-17566c049c21
        alb.ingress.kubernetes.io/security-groups: sg-08bd0b548c9917382
        alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"