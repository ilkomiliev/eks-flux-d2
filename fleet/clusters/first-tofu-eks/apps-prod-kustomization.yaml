apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  interval: 5m
  path: ./overlays/prod
  prune: true
  sourceRef:
    kind: OCIRepository
    name: apps-prod
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: infra
  decryption:
    provider: sops