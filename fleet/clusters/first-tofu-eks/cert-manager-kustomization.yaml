apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./cert-manager
  prune: true
  sourceRef:
    kind: OCIRepository
    name: infra
  serviceAccountName: kustomize-controller
  wait: true
  timeout: 5m