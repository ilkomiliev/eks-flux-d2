apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  interval: 10m
  path: ./controllers
  prune: true
  sourceRef:
    kind: OCIRepository
    name: infra
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: cert-manager
    - name: namespaces
  wait: true