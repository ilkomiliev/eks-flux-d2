apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 10m
  path: ./namespaces
  prune: true
  sourceRef:
    kind: OCIRepository
    name: infra
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: cert-manager
  wait: true