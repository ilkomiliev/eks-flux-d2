apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: 1m
  url: oci://264930181295.dkr.ecr.us-east-1.amazonaws.com/first-tofu-flux-fleet
  provider: aws
  ref:
    tag: main
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: '^https://github\.com/ilkomiliev/eks-flux-d2/.github/workflows/publish-artifacts.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fleet
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/first-tofu-eks
  prune: true
  sourceRef:
    kind: OCIRepository
    name: fleet